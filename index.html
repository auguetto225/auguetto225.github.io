<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Au Guetto 225</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<meta property="og:title" content="Au Guetto 225">
<meta property="og:description" content="Tout ce dont vous avez besoin, au même endroit. Commandez en ligne, livraison à Abidjan.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://auguetto225.github.io/logo.png">
<style>
.share{margin:0 0 12px}.shl{width:100%;margin-top:8px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.85rem}.sr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}#shmsg{display:block;color:var(--vert);font-weight:700;margin-top:6px}
:root{--bg:#f6f4f1;--card:#fff;--ink:#20262e;--mute:#6b7280;--or:#f97316;--or2:#ea580c;--vert:#16a34a;--line:#e7e2dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#20262e;--ink:#f3f4f6;--mute:#9ca3af;--line:#343b45}}
:root[data-theme="dark"]{--bg:#15181d;--card:#20262e;--ink:#f3f4f6;--mute:#9ca3af;--line:#343b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 0;border-bottom:3px solid;border-image:linear-gradient(90deg,var(--or) 66%,var(--vert) 66%) 1}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.6rem;letter-spacing:-.5px;line-height:1}
.logo img{border-radius:10px;width:44px;height:44px;object-fit:contain}
.logo i{font-style:normal;color:var(--or)}
.logo small{color:var(--vert);font-size:.9rem;margin-left:4px}
#cartbtn{position:relative;background:var(--or);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:900 .95rem inherit;font-family:inherit;cursor:pointer}
#cartbtn span{background:var(--ink);color:var(--bg);border-radius:10px;padding:0 7px;margin-left:6px;font-size:.8rem}
#q{width:100%;margin-top:10px;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
#q:focus{outline:none;border-color:var(--or)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.cat{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 14px;font:700 .9rem inherit;font-family:inherit;cursor:pointer}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat:focus-visible,button:focus-visible{outline:3px solid var(--vert);outline-offset:2px}
.ban{margin:12px 0;padding:16px;border-radius:16px;background:var(--or);color:#fff}
.ban b{font-size:1.15rem;display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:30px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.pic{font-size:3.4rem;text-align:center;padding:18px 0;background:linear-gradient(135deg,#fff3e8,#e8f7ee)}
.inf{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.inf h3{margin:0;font-size:.92rem;font-weight:700}
.old{color:var(--mute);text-decoration:line-through;font-size:.8rem}
.pr{font-weight:900;color:var(--or2)}
.tag{font-size:.75rem;color:var(--vert);font-weight:700}
.add{margin-top:auto;background:var(--vert);color:#fff;border:0;border-radius:10px;padding:9px;font:700 .9rem inherit;font-family:inherit;cursor:pointer}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
#panel.on{display:block}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(100%,400px);background:var(--bg);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px}
.row button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:1rem}
.tot{font-weight:900;font-size:1.2rem;display:flex;justify-content:space-between}
.sheet input{padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.go{background:var(--or);color:#fff;border:0;border-radius:12px;padding:13px;font:900 1rem inherit;font-family:inherit;cursor:pointer}
.close{align-self:flex-end;background:none;border:0;color:var(--ink);font-size:1.6rem;cursor:pointer}
.ok{background:var(--vert);color:#fff;border-radius:12px;padding:14px;font-weight:700}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div class="logo"><img src="logo.png" alt="" onerror="this.style.display='none'">Au <i>Guetto</i><small>225</small></div>
  <div style="display:flex;gap:8px"><button class="cat" id="accbtn" aria-label="Mon compte">👤 Compte</button><button id="cartbtn" aria-label="Ouvrir le panier">Panier<span id="n">0</span></button></div></div>
  <input id="q" type="search" placeholder="Rechercher un produit" aria-label="Rechercher">
</div></header>
<main class="wrap">
  <div class="cats" id="cats"></div>
  <div class="ban"><b>Tout ce dont vous avez besoin, au même endroit</b>Livraison à Abidjan et paiement à la livraison.</div>
  <div class="share"><b>Partage la boutique</b><div class="sr"><button class="cat" data-sh="native">📤 Partager</button><button class="cat" data-sh="cp">Copier le lien</button></div><input id="shl" class="shl" readonly aria-label="Lien de la boutique"><small id="shmsg" role="status"></small></div>
  <div class="grid" id="grid"></div>
</main>
<div id="panel"><div class="sheet" id="sheet"></div></div>
<script>
const P=[
 {n:'iPhone 18 Pro Max 256 Go',c:'Électronique',p:1115000,e:'📱'},
 {n:'iPhone 18 Pro Max 512 Go',c:'Électronique',p:1279000,e:'📱'},
 {n:'iPhone 18 Pro Max 1 To',c:'Électronique',p:1615000,e:'📱'},
 {n:'iPhone 18 Pro Max 2 To',c:'Électronique',p:2115000,e:'📱'},
 {n:'Smartphone 6,5" 128 Go',c:'Électronique',p:85000,o:105000,e:'📱'},
 {n:'Écouteurs sans fil',c:'Électronique',p:9500,o:14000,e:'🎧'},
 {n:'Chargeur rapide 33W',c:'Électronique',p:4500,e:'🔌'},
 {n:'Tee-shirt coton homme',c:'Mode',p:5000,o:7500,e:'👕'},
 {n:'Robe wax femme',c:'Mode',p:12000,e:'👗'},
 {n:'Baskets confort',c:'Mode',p:15000,o:20000,e:'👟'},
 {n:'Ventilateur sur pied',c:'Maison',p:18500,e:'🌀'},
 {n:'Set de casseroles 5 pièces',c:'Maison',p:22000,o:28000,e:'🍳'},
 {n:'Beurre de karité 250 ml',c:'Beauté',p:2500,e:'🧴'},
 {n:'Parfum 50 ml',c:'Beauté',p:8000,o:11000,e:'🌸'},
 {n:'Ballon de football',c:'Sport',p:6500,e:'⚽'},
 {n:'Tenue de sport',c:'Sport',p:9000,e:'🏃'}
];
const C=['Tout',...new Set(P.map(x=>x.c))];
let cat='Tout',q='',cart={};
const f=n=>n.toLocaleString('fr-FR')+' FCFA';
const $=i=>document.getElementById(i);
function cats(){$('cats').innerHTML=C.map(c=>`<button class="cat ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');}
function grid(){
 const l=P.map((x,i)=>({...x,i})).filter(x=>(cat==='Tout'||x.c===cat)&&x.n.toLowerCase().includes(q));
 $('grid').innerHTML=l.length?l.map(x=>`<div class="p"><div class="pic" aria-hidden="true">${x.e}</div><div class="inf"><h3>${x.n}</h3>${x.o?`<span class="old">${f(x.o)}</span><span class="tag">-${Math.round(100-x.p/x.o*100)}%</span>`:''}<span class="pr">${f(x.p)}</span><button class="add" data-i="${x.i}">Ajouter au panier</button></div></div>`).join(''):'<p>Aucun produit trouvé. Essaie un autre mot.</p>';
}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((a,[i,k])=>a+P[i].p*k,0);
const WA='2250585285278';
let U={},H=[];
try{U=JSON.parse(localStorage.getItem('agU')||'{}');H=JSON.parse(localStorage.getItem('agH')||'[]');}catch(e){}
const sv=()=>{try{localStorage.setItem('agU',JSON.stringify(U));localStorage.setItem('agH',JSON.stringify(H));}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function acct(msg){
 $('sheet').innerHTML=`<button class="close" data-x="1" aria-label="Fermer">×</button><h2 style="margin:0">Mon compte</h2>${msg?`<div class="ok">${msg}</div>`:''}<input id="an" placeholder="Nom" autocomplete="name" value="${esc(U.n)}"><input id="ap" placeholder="Téléphone" inputmode="tel" autocomplete="tel" value="${esc(U.p)}"><input id="aq" placeholder="Commune / quartier" value="${esc(U.a)}"><button class="go" data-sv="1">Enregistrer</button>`+(H.length?`<h3 style="margin:8px 0 0">Mes commandes</h3>`+H.slice().reverse().map(o=>`<div class="row"><span>${esc(o.d)}<br><small>${esc(o.l)}</small></span><b>${f(o.t)}</b></div>`).join(''):'');
 $('panel').classList.add('on');
}
function sheet(done,url){
 const items=Object.entries(cart);
 $('sheet').innerHTML=`<button class="close" data-x="1" aria-label="Fermer">×</button><h2 style="margin:0">Mon panier</h2>`+
 (done?`<div class="ok">Ta commande est prête. Appuie sur le bouton pour l'envoyer sur WhatsApp : nous te confirmons la livraison.</div><a class="go" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">Envoyer sur WhatsApp</a>`:
 items.length?items.map(([i,k])=>`<div class="row"><span>${P[i].e} ${P[i].n}<br><b>${f(P[i].p*k)}</b></span><span><button data-m="${i}" aria-label="Retirer">−</button> ${k} <button data-a="${i}" aria-label="Ajouter">+</button></span></div>`).join('')+
 `<div class="tot"><span>Total</span><span>${f(total())}</span></div><input id="nm" placeholder="Nom" autocomplete="name" value="${esc(U.n)}"><input id="ph" placeholder="Téléphone" inputmode="tel" autocomplete="tel" value="${esc(U.p)}"><input id="ad" placeholder="Commune / quartier (ex : Cocody, Angré)" value="${esc(U.a)}"><button class="go" data-go="1">Commander (paiement à la livraison)</button>`
 :'<p>Ton panier est vide. Ajoute un produit pour commencer.</p>');
}
const SITE=location.href.split('#')[0].split('?')[0];
function share(k){
 const t='Au Guetto 225 : commandez en ligne, livraison à Abidjan.',m=$('shmsg'),i=$('shl');
 const copy=()=>{i.focus();i.select();i.setSelectionRange(0,999);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(ok){m.textContent='Lien copié !';return;}
  try{navigator.clipboard.writeText(SITE).then(()=>{m.textContent='Lien copié !';},()=>{m.textContent='Appuie longuement sur le lien ci-dessus pour le copier.';});}
  catch(e){m.textContent='Appuie longuement sur le lien ci-dessus pour le copier.';}};
 if(k==='native'&&navigator.share){navigator.share({title:'Au Guetto 225',text:t,url:SITE}).catch(er=>{if(er&&er.name!=='AbortError')copy();});return;}
 copy();
}
$('shl').value=SITE;
document.addEventListener('click',e=>{
 const t=e.target.closest('button,#panel');if(!t)return;const d=t.dataset||{};
 if(d.c){cat=d.c;cats();grid();}
 else if(d.i!==undefined){cart[d.i]=(cart[d.i]||0)+1;upd();}
 else if(d.a){cart[d.a]++;upd();sheet();}
 else if(d.m){if(--cart[d.m]<=0)delete cart[d.m];upd();sheet();}
 else if(t.id==='cartbtn'){sheet();$('panel').classList.add('on');}
 else if(d.x||t.id==='panel'){if(e.target.id==='panel'||d.x)$('panel').classList.remove('on');}
 else if(d.sh){share(d.sh);}
 else if(t.id==='accbtn'){acct();}
 else if(d.sv){U={n:$('an').value.trim(),p:$('ap').value.trim(),a:$('aq').value.trim()};sv();acct('Compte enregistré.');}
 else if(d.go){if(!$('nm').value.trim()||!$('ph').value.trim()||!$('ad').value.trim()){$('ph').placeholder='Remplis nom, téléphone et quartier';return;}const L=Object.entries(cart).map(([i,k])=>'- '+k+' x '+P[i].n+' : '+f(P[i].p*k)).join('\n');
 const msg='Bonjour Au Guetto 225, je veux commander :\n'+L+'\n\nTotal : '+f(total())+'\nPaiement : à la livraison\n\nNom : '+$('nm').value.trim()+'\nTéléphone : '+$('ph').value.trim()+'\nQuartier : '+$('ad').value.trim();
 const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
 U={n:$('nm').value.trim(),p:$('ph').value.trim(),a:$('ad').value.trim()};
 H.push({d:new Date().toLocaleDateString('fr-FR'),l:Object.entries(cart).map(([i,k])=>k+' x '+P[i].n).join(', '),t:total()});sv();
 cart={};upd();sheet(true,url);}
});
function upd(){$('n').textContent=count();}
$('q').addEventListener('input',e=>{q=e.target.value.toLowerCase();grid();});
cats();grid();
(l=>{l.rel='icon';l.href='logo.png';document.head.appendChild(l)})(document.createElement('link'));
</script>
</body>
</html>
